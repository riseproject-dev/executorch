# Out-variant schemas for the RISC-V kernel-library backend. Mirrors the aten
# signatures the ConvertToRiscvPass rewrites to, namespaced under `riscv::`
# so portable's identically-named kernels stay unaffected.

- func: riscv::add.out(Tensor self, Tensor other, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: riscv::add_out

- func: riscv::hardtanh.out(Tensor self, Scalar min_val=-1, Scalar max_val=1, *, Tensor(a!) out) -> Tensor(a!)
  variants: function
  kernels:
    - arg_meta: null
      kernel_name: riscv::hardtanh_out

